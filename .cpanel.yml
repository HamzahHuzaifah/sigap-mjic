---
deployment:
  tasks:
    # 1. Pastikan path ini sesuai dengan path di cPanel Anda
    - export FRONTEND_DIR=/home/USER_CPANEL/public_html
    - export BACKEND_DIR=/home/USER_CPANEL/sigap-backend

    # 2. Deploy Frontend
    - cd sigap-frontend && npm install
    - cd sigap-frontend && npm run build
    - /bin/cp -R sigap-frontend/dist/* $FRONTEND_DIR/

    # 3. Deploy Backend
    - /bin/mkdir -p $BACKEND_DIR
    - /bin/cp -R sigap-backend/* $BACKEND_DIR/
    - cd $BACKEND_DIR && npm install --production
    - cd $BACKEND_DIR && npm run build
    - cd $BACKEND_DIR && npx prisma generate
